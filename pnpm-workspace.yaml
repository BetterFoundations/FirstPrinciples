packages:
  - 'packages/*'
  - 'docs'
  - 'examples/*'
  - 'tools/*'
  # tools/package-template is a copy-and-rename scaffold (spec §3.1), not a
  # real workspace member — it has no working dist/exports of its own.
  - '!tools/package-template'
allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
overrides:
  esbuild: '>=0.28.1'
