name: Deploy Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'packages/**/src/**']

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --trust-lockfile

      # The path filter above matches `packages/**/src/**`, which now exists
      # (core, logger) — but the `docs` workspace package itself (Astro
      # Starlight, spec §8.2, with a TypeDoc generation step per spec §6.5)
      # doesn't exist yet. `pnpm --filter docs` silently no-ops with zero
      # matched packages rather than failing, so without this check the job
      # would reach `upload-pages-artifact` with no `docs/dist` to upload.
      - name: Check docs package exists
        id: docs-check
        run: echo "exists=$(test -f docs/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.docs-check.outputs.exists == 'true'
        run: pnpm --filter docs run build

      - if: steps.docs-check.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/dist'

      - if: steps.docs-check.outputs.exists == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
