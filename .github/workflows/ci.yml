name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so `changeset status --since=origin/main` has
          # something to diff against.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      # No `-- --coverage` here: every package's own `test` script already
      # carries it (see tools/package-template), and vitest 4 rejects the
      # duplicate flag outright rather than ignoring it. Coverage settings
      # and thresholds live in each package's vitest.config.ts, via
      # @firstprinciples/vitest-config.
      - name: Test with coverage
        run: pnpm turbo run test

      # Runs even if the coverage gate above failed, so a red run still shows
      # which package(s) missed threshold. Free replacement for a paid
      # Codecov PR comment/dashboard.
      - name: Coverage summary
        if: always()
        run: pnpm coverage:summary

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            packages/*/coverage/**
            examples/*/coverage/**
            tools/*/coverage/**
            docs/coverage/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: pnpm turbo run build

      - name: Bundle size check
        run: pnpm run size

      - name: Changeset check
        run: pnpm changeset status --since=origin/main

      # Must run LAST: it does `git checkout -f main` *in place* in this same
      # working directory to build its bundle-size comparison, then
      # `pnpm install`s main's package.json — which drops any dependency
      # this PR added but main doesn't have yet — and never restores the
      # head branch/node_modules afterward. Any step placed after it runs
      # against that corrupted state (this is exactly what broke "Changeset
      # check" for several fixup commits before the ordering bug was found).
      # Diffs bundle size against the base branch, so it needs a valid
      # size-limit config on *both* sides. Non-blocking: `main` has no
      # size-limit setup at all until this very PR merges, so the
      # base-branch checkout has nothing to run against on the PR that first
      # introduces it. Budget enforcement itself is the plain step above,
      # which does fail the job — this step is PR-comment UX only.
      - name: Bundle size PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
